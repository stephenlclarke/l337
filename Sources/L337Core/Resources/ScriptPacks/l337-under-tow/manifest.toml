# Original Under Tow native opening. Lua supplies original briefing text only.
schemaVersion = 2
missionAPI = 2
id = "l337.under-tow"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "durable-commands-v2"]
priority = 591
source = "Original C24 Under Tow from Meridian c70110b292077588a0855fb48127adfb1b611c9d; under-tow.json SHA256 b5dac526f44b1599b66400a47e4bbf0a5e38f4b0c9cd9fa8431992bab75a9cb2. No physical coupling, load test, consent, tug/crew arrival, settlement, fee or clue is produced by this module."
