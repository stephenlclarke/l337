# Original Quiet Choir commission; no collector, culture or field evidence is issued here.
schemaVersion = 2
missionAPI = 2
id = "l337.quiet-choir"
version = "1.0.0"
minimumEngine = "2.0.0"
capabilities = ["script-lua-v1", "story-v2", "durable-commands-v2"]
priority = 630
source = "Original Quiet Choir from Meridian c70110b292077588a0855fb48127adfb1b611c9d; quiet-choir.json SHA256 41c9d24ae171e09f4b0bb43c5bbbdae602544d6b80bf86ec3e9da0c7ab2f0e60. Commission only; later actual calibration, collector recovery, analysis, culture receiving, listening, emitter shutdown, protocol, payment and clue remain native stages."
license = "MIT"
