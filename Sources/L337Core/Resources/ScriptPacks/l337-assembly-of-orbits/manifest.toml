[mission]
id = "assembly-of-orbits"
title = "An Assembly of Orbits"
briefing = "VOSS: A share certificate cannot stand in for the people on the next shift.\n\nA cluster of orbital homes must share a single transfer corridor during a maintenance season. Old voting records count property shares but omit the crews who keep the corridor open. The commander verifies real occupancy and operating work, escorts delegates and establishes either rotating worker stewardship or publicly bounded berth representation.\n\nAt Irkenan in Galaxy 7, after one ordinary trade. No imported score gate or source campaign prerequisite. The reference loan needs one tonne of free hold. The original reference is collected here before the survey departure. The settlement choice is made with actual arrived delegates at the witness receiver; final return/audit remains at this issuer."
destination = "Galaxy 7 / Irkenan / Darik / Brekudek / Kagakon / original Irkenan audit"
reward = "7700 CR only after actual observations, living witness receiving, both selected settlement proofs and original reference return. The absent seat clue accompanies successful terminal settlement."
milestones = ["Accept An Assembly of Orbits at Irkenan.", "Collect the identified one-tonne reference instrument from Marshal Nera Voss.", "Compare three consented occupancy/work registers with real corridor-slot use.", "Run two independent capacity tests with the onboard assembly console; submit all five identified proposals.", "Verify actual safe transit and living reception of the consenting delegate tender to the neutral assembly berth.", "At the actual witness receiving station, choose the settlement with the arrived authorised operator delegates.", "Verify both independent proofs for the selected settlement.", "Return the reference instrument and confirm all physical receiving and settlement receipts.", "Confirm successful completion, the recorded settlement and the once-only fee."]

[[handlers]]
event = "mission.accepted"
function = "accepted"
