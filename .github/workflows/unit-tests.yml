name: Isolated Unit Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-units-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      requires_build: ${{ steps.scope.outputs.requires_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            Tools/CI
            .github/workflows
      - id: scope
        name: Require the build unless the complete diff is documentation
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, tempfile
          from pathlib import Path

          # Use the classifier from the trusted base, never executable PR changes.
          needed = 'true'
          try:
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              name = os.environ['GITHUB_EVENT_NAME']
              base = (event['pull_request']['base']['sha'] if name == 'pull_request'
                      else event['before'] if name == 'push' else '')
              if re.fullmatch('[0-9a-f]{40}', base) and base != '0' * 40:
                  source = subprocess.check_output(
                      ['git', 'show', base + ':Tools/CI/change_scope.py'],
                      stderr=subprocess.DEVNULL)
                  with tempfile.TemporaryDirectory() as directory:
                      script = Path(directory) / 'change_scope.py'
                      script.write_bytes(source)
                      result = subprocess.check_output(
                          ['python3', '-I', str(script)]).decode().strip()
                      if result == 'false':
                          needed = 'false'
          except (KeyError, TypeError, ValueError, OSError, subprocess.SubprocessError):
              pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('requires_build=' + needed + '\n')
          PY
      - name: Check documentation routing contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Tools/CI -p 'test_change_scope.py'
  isolated-units:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.requires_build != 'false') }}
    # External PRs remain hosted. Enable the isolated VM only after provisioning.
    runs-on: ${{ github.event_name == 'push' && github.repository == 'stephenlclarke/l337' && github.actor_id == '22142777' && vars.ELITE_LOCAL_RUNNER_ENABLED == 'true' && fromJSON('["self-hosted", "macOS", "ARM64", "elite-ci"]') || 'macos-15' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: ${{ runner.environment != 'self-hosted' }}
      - name: Verify local runner and retain incremental build
        if: runner.environment == 'self-hosted'
        run: python3 Tools/CI/local_runner.py
      - name: Verify isolated report checks
        run: python3 -m unittest discover -s Tools/CI -p 'test_isolated*.py'
      - name: Verify local runner guards
        run: make local-runner-check
      - name: Verify shared control authority
        run: make flight-controls-check
      - name: Identify Swift toolchain
        id: toolchain
        shell: bash
        run: |
          swift --version
          printf 'key=%s\n' "$(swift --version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore incremental Swift build
        if: runner.environment != 'self-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: isolated-units-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            isolated-units-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Run maintained isolated units
        run: make unit-ci
      - name: Upload exact-commit unit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-units-${{ github.sha }}
          path: reports/isolated-units/
          if-no-files-found: warn
